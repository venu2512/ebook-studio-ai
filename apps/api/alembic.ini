# Alembic configuration for eBook Studio AI.
# The database URL is injected at runtime from app settings (see alembic/env.py),
# so this file deliberately does not hard-code a connection string.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# SQLAlchemy URL is set programmatically from Settings.DATABASE_URL.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
