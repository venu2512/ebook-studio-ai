[project]
name = "ebook-studio-api"
version = "0.1.0"
description = "eBook Studio AI - FastAPI backend, agent pipeline and export service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "eBook Studio AI" }]

dependencies = [
  # Web framework
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  # Validation / settings
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.2",
  "email-validator>=2.2.0",
  # Database
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.3",
  "greenlet>=3.1.1",
  # Auth
  "pyjwt>=2.9.0",
  "argon2-cffi>=23.1.0",
  "itsdangerous>=2.2.0",
  # HTTP / retries
  "httpx>=0.27.2",
  "tenacity>=9.0.0",
  # Queue / cache
  "redis>=5.1.1",
  "arq>=0.26.3",
  # Storage
  "boto3>=1.35.0",
  # Document generation
  "ebooklib>=0.18",
  "python-docx>=1.1.2",
  "fpdf2>=2.7.9",
  "markdown-it-py>=3.0.0",
  "mdit-py-plugins>=0.4.2",
  "Pillow>=10.4.0",
  # Billing
  "stripe>=11.0.0",
  # Observability
  "structlog>=24.4.0",
  "sentry-sdk[fastapi]>=2.14.0",
]

[project.optional-dependencies]
# High-fidelity HTML -> PDF renderer. Requires system libraries (see Dockerfile).
# When absent, the exporter falls back to the built-in fpdf2 renderer.
pdf = ["weasyprint>=62.3"]
# Real image generation for covers (optional).
images = ["openai>=1.51.0"]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "asgi-lifespan>=2.1.0",
  "httpx>=0.27.2",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "types-itsdangerous>=1.1.2",
  "faker>=30.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF", "BLE"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101", "E501"]
"alembic/env.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["alembic/versions", "app/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning:passlib.*",
  "ignore::DeprecationWarning:sqlalchemy.*",
]
